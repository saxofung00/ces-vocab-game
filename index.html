<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CES Vocabulary Defense - Arcade Edition</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(15, 23, 42, 0.95);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.45);
      --accent: #f43f5e;
      --gold: #fbbf24;
      --purple: #c084fc;
      --green: #4ade80;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    #canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Top Navigation HUD */
    .hud {
      position: absolute; top: 0; left: 0; width: 100%; min-height: 58px;
      padding: 8px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.94) 0%, rgba(9, 13, 22, 0.6) 80%, transparent 100%);
      z-index: 15;
    }
    .hud-left, .hud-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hud-stat { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.95rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .hud-stat span { color: var(--primary); }
    .player-badge {
      background: rgba(30, 41, 59, 0.9); border: 1px solid #475569; padding: 4px 10px;
      border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: #e2e8f0;
    }
    .mode-badge {
      padding: 3px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-normal { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; }
    .badge-hard { background: rgba(251, 191, 36, 0.2); border: 1px solid #fbbf24; color: #fbbf24; }
    .badge-fever { background: rgba(244, 63, 94, 0.25); border: 1px solid #f43f5e; color: #fda4af; animation: pulse 1s infinite; }
    .hearts { color: var(--accent); font-size: 1.1rem; letter-spacing: 2px; }

    .hud-btn {
      background: rgba(30, 41, 59, 0.92); border: 1px solid #64748b; color: #f8fafc;
      padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 800;
      cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
    }
    .hud-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
    .hud-btn-restart { border-color: rgba(251, 191, 36, 0.6); color: var(--gold); }
    .hud-btn-restart:hover { background: rgba(251, 191, 36, 0.15); border-color: var(--gold); }

    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* Modals */
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.88); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 30; padding: 12px;
    }
    .modal-card {
      background: var(--panel); border: 2px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px var(--primary-glow);
      border-radius: 20px; width: 100%; max-width: 600px; padding: 20px 22px;
      text-align: center; max-height: 94vh; overflow-y: auto;
    }

    /* Header Bar inside Start Modal */
    .start-header {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 12px;
      text-align: left;
    }
    .btn-play-hero {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: 2px solid #86efac; color: #fff; padding: 10px 18px; border-radius: 12px;
      font-size: 0.95rem; font-weight: 900; cursor: pointer; white-space: nowrap;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.5); transition: all 0.2s;
    }
    .btn-play-hero:hover { transform: scale(1.04); box-shadow: 0 0 26px rgba(74, 222, 128, 0.75); }

    /* Student Identity Box */
    .student-box {
      background: rgba(30, 41, 59, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px; padding: 12px; margin-bottom: 12px; text-align: left;
    }
    .student-box-title {
      font-size: 0.76rem; font-weight: 800; color: var(--primary); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .student-grid { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; }
    .student-field label { display: block; font-size: 0.72rem; color: #94a3b8; font-weight: 700; margin-bottom: 3px; }
    .student-field input {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 0.9rem; font-weight: 700; outline: none;
    }
    .student-field input:focus { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }
    .input-error { border-color: var(--accent) !important; box-shadow: 0 0 8px rgba(244, 63, 94, 0.5) !important; }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8; color: #fff; padding: 11px 16px; border-radius: 11px;
      font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35); display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(56, 189, 248, 0.55); }
    .btn-gold { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); border-color: #fbbf24; }
    .btn-secondary { background: rgba(51, 65, 85, 0.85); border-color: #64748b; }

    /* Leaderboard Tabs */
    .lb-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: rgba(15, 23, 42, 0.9); padding: 5px; border-radius: 12px;
      border: 1px solid #334155; margin-bottom: 10px;
    }
    .lb-tab {
      padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 800;
      cursor: pointer; border: 1px solid transparent; color: #94a3b8; background: transparent;
      transition: all 0.15s;
    }
    .lb-tab.active {
      background: rgba(251, 191, 36, 0.18); border-color: #fbbf24; color: #fbbf24;
    }
    .class-bar-bg {
      width: 100%; height: 6px; background: rgba(51, 65, 85, 0.8); border-radius: 999px; margin-top: 5px; overflow: hidden;
    }
    .class-bar-fill {
      height: 100%; background: linear-gradient(90deg, #38bdf8, #fbbf24); border-radius: 999px;
    }

    /* Difficulty Mode Selector */
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 12px 0; }
    .mode-card {
      background: rgba(30, 41, 59, 0.8); border: 2px solid #334155; border-radius: 12px;
      padding: 9px 6px; cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .mode-card:hover { border-color: #64748b; }
    .mode-card.active-normal { border-color: #38bdf8; background: rgba(56, 189, 248, 0.15); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
    .mode-card.active-hard { border-color: #fbbf24; background: rgba(251, 191, 36, 0.15); box-shadow: 0 0 12px rgba(251, 191, 36, 0.25); }
    .mode-card.active-fever { border-color: #f43f5e; background: rgba(244, 63, 94, 0.18); box-shadow: 0 0 14px rgba(244, 63, 94, 0.3); }
    .mode-title { font-weight: 800; font-size: 0.88rem; margin-bottom: 3px; }
    .mode-desc { font-size: 0.7rem; color: #94a3b8; line-height: 1.25; }

    /* Selects & Inputs */
    .select-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;
